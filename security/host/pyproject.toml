[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiviss-security-host"
version = "0.1.0"
description = "Local T.I.V.I.S.S. policy decision point (PDP) daemon over a Unix domain socket."
requires-python = ">=3.10"
dependencies = ["tiviss-security-protocol>=0.1.0", "tiviss-security-ipc>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tiviss-security-pdp = "tiviss_security_host.cli:main"

[tool.setuptools]
packages = ["tiviss_security_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
